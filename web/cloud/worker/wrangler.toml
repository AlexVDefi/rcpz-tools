name = "pz-studio-cloud"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# The R2 bucket that stores shared renders. Create it first:
#   wrangler r2 bucket create pz-studio-shares
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "pz-studio-shares"

[vars]
# Supabase project (Project Settings -> API). The anon key is public and only used here to
# verify user tokens against /auth/v1/user.
SUPABASE_URL = "https://dkivmjidqzcgmarazcth.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_OajY7dEbz1DZmrGffL2K1Q_UTuYLWsz"
# App origins allowed to call the API AND to receive the Steam sign-in redirect (comma-separated).
# The Steam callback only redirects back to an origin in this list (guards against open redirect).
ALLOWED_ORIGINS = "https://survivor.rcpz.tools,http://localhost:5173,http://localhost:5174"
# 100 MB per user. Change here + in web/src/cloud/config.ts if you ever raise it.
QUOTA_BYTES = "104857600"

# Secrets (NOT in this file) - set once each with `wrangler secret put <NAME>`:
#   SUPABASE_SERVICE_ROLE   Supabase service_role key (Project Settings -> API). Bypasses RLS so the
#                           Worker can read usage and write/delete rows on the user's behalf.
#   STEAM_WEB_API_KEY       https://steamcommunity.com/dev/apikey - lists a modder's Workshop mods.
#   STEAM_SESSION_SECRET    any long random string - HMAC key for the modder session token.
#   ADMIN_EMAIL             the one account email allowed to read /admin/* (kept out of the repo on
#                           purpose). Set with: wrangler secret put ADMIN_EMAIL   Leave unset to
#                           disable the admin endpoints entirely (they then 403 for everyone).

# Custom share domain: after `wrangler deploy`, map a domain to this Worker in the Cloudflare
# dashboard (Workers & Pages -> pz-studio-cloud -> Settings -> Domains & Routes -> Add custom
# domain), e.g. share.yourdomain.com. That URL becomes VITE_CLOUD_API for the web app.
